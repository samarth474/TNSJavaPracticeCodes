<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPersonal Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Main Player Card -->
    <main class="player-card">
      
      <!-- Search & Voice Section -->
      <section class="search-section">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search by song title or artist...">
          <button id="voice-search-btn" title="Search using voice">🎙️</button>
        </div>
        <div id="voice-status" class="voice-status"></div>
      </section>

      <!-- Now Playing Display -->
      <section class="now-playing">
        <img id="album-cover" src="assets/covers/cover1.jpg" alt="Album Cover">
        <div class="song-info">
          <h1 id="song-title">Song Title</h1>
          <p id="song-artist">Artist Name</p>
        </div>
        <button id="favorite-btn" class="favorite-btn" title="Add to Favorites">❤️ Favorite</button>
      </section>

      <!-- Progress Section -->
      <section class="progress-section">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" min="0" max="100" value="0">
        <span id="total-time">0:00</span>
      </section>

      <!-- Playback Controls -->
      <section class="controls-section">
        <button id="prev-btn" class="ctrl-btn" title="Previous Song">⏮️</button>
        <button id="play-btn" class="ctrl-btn play-pause-btn" title="Play/Pause">▶️</button>
        <button id="next-btn" class="ctrl-btn" title="Next Song">⏭️</button>
      </section>

      <!-- Volume Controls -->
      <section class="volume-section">
        <span class="vol-icon">🔊</span>
        <input type="range" id="volume-bar" min="0" max="100" value="70">
        <span id="volume-label">70%</span>
      </section>

    </main>

    <!-- Sidebar with Lists -->
    <aside class="sidebar-card">
      
      <!-- Navigation Tabs -->
      <nav class="tabs">
        <button class="tab-btn active" id="tab-playlist">Playlist</button>
        <button class="tab-btn" id="tab-favorites">Favorites</button>
        <button class="tab-btn" id="tab-recent">Recently Played</button>
      </nav>

      <!-- List Container -->
      <section class="list-content">
        <ul id="song-list" class="song-list">
          <!-- Items populated via JS -->
        </ul>
      </section>

    </aside>

  </div>

  <!-- Voice Recognition Modal -->
  <div id="voice-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Voice Search</h2>
      <p>Listening for song title...</p>
      <div class="mic-icon">🎙️</div>
      <button id="close-voice-btn">Cancel</button>
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="audio-player"></audio>

  <script src="app.js"></script>
</body>
</html>
